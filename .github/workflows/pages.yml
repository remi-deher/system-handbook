name: Pages

# Construit le site MkDocs Material à partir des fichiers Markdown. Sur une PR, vérifie seulement que le
# site se construit ; sur `main`, le publie sur GitHub Pages. Le site demande aux moteurs de ne pas
# l'indexer (robots.txt et balise noindex) ; voir .github/pages/ pour l'ouvrir.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: pages (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install pinned MkDocs Material (hashes required)
        run: python -m pip install --require-hashes -r .github/pages/requirements.txt

      - name: Prepare the site sources
        run: python -B .github/scripts/prepare-site.py _site-src

      - name: Build the site
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: mkdocs build --strict -f .github/pages/mkdocs.yml

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: pages (deploy)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
