name: Repository validation

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0

      - name: Run the same checks as local hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Scan the complete Git history
        run: pre-commit run secrets-history --hook-stage manual --all-files

      - name: Test the repository-specific rules
        run: python -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
